name: PHP Composer

on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v1

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '5.6'
          extensions: zip
          
      - name: Set Node Version
        uses: actions/setup-node@v2
        with:
          node-version-file: '.nvmrc'
        
      - name: Install dependencies
        # The browser Puppeteer downloads is only needed for the test suite
        env:
          PUPPETEER_SKIP_DOWNLOAD: true
        run: npm install

      - name: Build
        # webpack 4 needs the legacy OpenSSL provider on current Node versions
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: npx webpack -p

      - name: WordPress Plugin Deploy
        if: startsWith(github.ref, 'refs/tags/')
        uses: 10up/action-wordpress-plugin-deploy@1.4.1
        env:
          SLUG: acf-image-aspect-ratio-crop
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}

      - name: Build release ZIP
        env:
          SLUG: acf-image-aspect-ratio-crop
        run: |
          # Same exclusion list the wordpress.org deploy uses, so the two
          # artifacts contain the same files.
          BUILD_DIR="$RUNNER_TEMP/build"
          mkdir -p "$BUILD_DIR/$SLUG"
          rsync -a --exclude-from=.distignore ./ "$BUILD_DIR/$SLUG/"
          cd "$BUILD_DIR" && zip -r "$GITHUB_WORKSPACE/$SLUG.zip" "$SLUG"

      - uses: actions/upload-artifact@master
        with:
          name: acf-image-aspect-ratio-crop.zip
          path: acf-image-aspect-ratio-crop.zip

      - name: Get the version
        id: get_version
        run: echo ::set-output name=VERSION::${GITHUB_REF/refs\/tags\//}

      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: acf-image-aspect-ratio-crop.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
